[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helpcode"
version = "0.1.0"
description = "终端 AI 编程助手：ReAct 循环、工具调用、上下文压缩、多 Agent 协作与评测"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
    "python-dotenv>=1.2.4",
    "path>=17.1.1",
    "mcp>=1.0,<2",
]

[project.scripts]
helpcode = "helpcode.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
# runs/ 与 eval_datasets/ 是本地产物：里面是评测工作区（含测试文件），
# 被 pytest 收进来会把「模型改坏的语法」当成项目测试失败。
# 自定义 norecursedirs 会覆盖 pytest 默认值（默认含 .*），所以必须显式补回。
# 漏掉 `.helpcode` 时，ch15 留下的 worktree 里有同名 test_*.py，
# 会和 tests/ 撞 import 直接让收集崩掉。
norecursedirs = [".*", "runs", "eval_datasets", ".venv", "__pycache__", "build", "dist", "node_modules"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 设计文档里的 Python 代码块是「说明」不是「源码」，
# 不能让 ruff format 去改写它们（ch06 遗留下来的门禁红就是它造成的）。
# 评测产物（runs/）与合成题仓库（eval_datasets/）是「被检查的对象」，
# 不是源码：格式化它们会改动被测样本，破坏可复现性。
extend-exclude = ["*.md", "runs", "eval_datasets", ".helpcode"]

[tool.ruff.lint]
# RUF012：Textual 框架要求用 BINDINGS 类属性（可变默认值属框架约定）
# BLE001：spec F11 要求捕获所有请求异常转为 err 事件，不退出会话
ignore = ["RUF012", "BLE001"]
