[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "helpcode"
version = "0.1.0"
description = "多协议 LLM 终端对话客户端（Claude Code 风格）"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
    "rich>=13",
    "anthropic>=0.40",
    "openai>=1.50",
    "pyyaml>=6",
    "python-dotenv>=1.2.4",
    "path>=17.1.1",
]

[project.scripts]
helpcode = "helpcode.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
# RUF012：Textual 框架要求用 BINDINGS 类属性（可变默认值属框架约定）
# BLE001：spec F11 要求捕获所有请求异常转为 err 事件，不退出会话
ignore = ["RUF012", "BLE001"]
